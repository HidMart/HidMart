[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hidmart-selfbot"
version = "0.1.0"
description = "Independent asynchronous SelfBot library for Bale Messenger"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "httpx>=0.28,<1",
    "websockets>=15,<17",
    "protobuf>=6.30,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hidmart*"]