[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hidmart"
version = "0.2.1"
description = "Async Python framework for building token-based bots for Bale Messenger"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

authors = [
    {name = "HidMart Team"}
]

dependencies = [
    "httpx>=0.27,<1.0"
]

[tool.setuptools.packages.find]
include = ["hidmart*"]